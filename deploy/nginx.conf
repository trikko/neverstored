# TLS and the visitor's address; neverstored does the rest.
#
# $remote_addr is the peer nginx actually accepted, and the header is set rather than added
# to: an X-Forwarded-For arriving from the client is a claim about someone else and is
# dropped here. nginx resolves this at request time from the connection itself, so unlike
# Caddy's {remote_host} placeholder it cannot come out empty — see the note in ./Caddyfile.
# $proxy_add_x_forwarded_for, which appends instead, works too: neverstored reads the last
# entry either way.
#
# If a CDN or load balancer sits in front of nginx, describe it with set_real_ip_from and
# real_ip_header so $remote_addr becomes the visitor again.

map $request_uri $loggable {
    ~*^/r/ 0;
    ~*^/api/ 0;
    ~*\.(css|js|svg|png|ico|jpg|jpeg|gif|webp|woff|woff2|ttf)$ 0;
    default 1;
}

server {
    listen 443 ssl;
    server_name neverstored.example;

    ssl_certificate     /etc/letsencrypt/live/neverstored.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/neverstored.example/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Skip access logs for static assets, noisy API polling, and for privacy reasons do not log room names (/r/*)
    access_log /var/log/nginx/neverstored.access.log combined if=$loggable;

    # set_real_ip_from 203.0.113.0/24;
    # real_ip_header X-Forwarded-For;
    # real_ip_recursive on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rooms are polled: a reply may take a while to have anything to say.
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}
